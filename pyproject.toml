[project]
name = "sipl-toolkit"
version = "0.1.0"
description = "Parser, interpreter, tracer and visualizers for SIPL (SImple Programming Language)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lark>=1.2,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
sipl = "sipl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sipl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src"]
